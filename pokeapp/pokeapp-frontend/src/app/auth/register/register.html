<div class="auth">
  <h1>Registro</h1>

  <form (ngSubmit)="submit()" class="box">
    <label>Nombre de usuario</label>
    <input
      [(ngModel)]="username"
      name="username"
      placeholder="ej: pikachu123"
      required
      autocomplete="username"
    />

    <label>Email</label>
    <input
      [(ngModel)]="email"
      name="email"
      type="email"
      placeholder="ej: usuario@ejemplo.com"
      required
      autocomplete="email"
    />

    <label>Contraseña</label>
    <div class="password-container">
      <input
        [(ngModel)]="password"
        name="password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="mínimo 6 caracteres"
        required
        autocomplete="new-password"
        (input)="checkPasswordStrength()"
      />
      <button type="button" class="toggle-password" (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
        <span class="eye-icon" [class.eye-open]="showPassword">👁</span>
      </button>
    </div>

    <div class="password-strength" *ngIf="password">
      <div class="strength-bar">
        <div class="strength-fill" [style.width.%]="passwordStrength"
             [style.backgroundColor]="getStrengthColor()"></div>
      </div>
      <div class="strength-text">
        {{ getStrengthText() }}
      </div>
    </div>

    <label>Repite contraseña</label>
    <div class="password-container">
      <input
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        [type]="showConfirmPassword ? 'text' : 'password'"
        placeholder="repite la contraseña"
        required
        autocomplete="new-password"
      />
      <button type="button" class="toggle-password" (click)="toggleConfirmPassword()"
              [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
        <span class="eye-icon" [class.eye-open]="showConfirmPassword">👁</span>
      </button>
    </div>

    <label class="terms">
      <input type="checkbox" [(ngModel)]="acceptTerms" name="acceptTerms">
      <span>
        Acepto los <a href="#" (click)="$event.preventDefault()">términos y condiciones</a>
      </span>
    </label>

    <button type="submit" [disabled]="loading || !acceptTerms" [class.loading]="loading">
      <span *ngIf="!loading">Registrarse</span>
      <span *ngIf="loading">Creando cuenta...</span>
    </button>

    <p class="error" *ngIf="error" role="alert">{{ error }}</p>
    <p class="success" *ngIf="successMessage" role="status">{{ successMessage }}</p>
  </form>

  <p class="hint">
    ¿Ya tienes cuenta?
    <a routerLink="/login">Inicia sesión aquí</a>
  </p>
</div>
