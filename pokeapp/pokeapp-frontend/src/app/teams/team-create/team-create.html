<div class="team-create-container">
  <h2>{{ isEditing ? 'Editar Equipo' : 'Crear Nuevo Equipo' }}</h2>

  <form [formGroup]="teamForm" (ngSubmit)="onSubmit()">

    <!-- Nombre -->
    <div class="form-group">
      <label for="name">Nombre del Equipo *</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Ej: Mi equipo competitivo"
        class="form-input"
      />
      <div
        *ngIf="teamForm.get('name')?.invalid && teamForm.get('name')?.touched"
        class="error-message"
      >
        El nombre es requerido (mínimo 3 caracteres)
      </div>
    </div>

    <!-- Descripción -->
    <div class="form-group">
      <label for="description">Descripción</label>
      <textarea
        id="description"
        formControlName="description"
        rows="3"
        placeholder="Describe tu estrategia o el propósito del equipo..."
        class="form-textarea"
      ></textarea>
    </div>

    <!-- Pokémon -->
    <div class="form-group">
      <label>Pokémon en el equipo ({{ selectedPokemons.length }}/6) *</label>

      <div class="selected-pokemon-grid">
        <div
          *ngFor="let pokemon of selectedPokemons; let i = index"
          class="selected-pokemon"
        >
          <img [src]="pokemon.sprite" [alt]="pokemon.name" class="pokemon-sprite" />
          <span class="pokemon-name">{{ pokemon.name }}</span>
          <button type="button" class="remove-btn" (click)="removePokemon(i)">✕</button>
        </div>

        <div *ngFor="let _ of emptySlots" class="empty-slot" (click)="openPokemonSelector()">
          + Añadir Pokémon
        </div>
      </div>

      <button type="button" class="btn btn-primary" (click)="openPokemonSelector()">
        🔍 Buscar y añadir Pokémon
      </button>
    </div>

    <!-- Etiquetas -->
    <div class="form-group">
      <label>Etiquetas</label>
      <div class="tags-container">
        <div
          *ngFor="let tag of availableTags"
          class="tag-option"
          [class.selected]="selectedTags.includes(tag)"
          (click)="toggleTag(tag)"
        >
          {{ tag }}
        </div>
      </div>
    </div>

    <!-- Acciones -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="teamForm.invalid || selectedPokemons.length === 0"
      >
        {{ isEditing ? 'Actualizar Equipo' : 'Crear Equipo' }}
      </button>
    </div>
  </form>

  <!-- Modal selector -->
  <div class="modal-overlay" *ngIf="showPokemonSelector" (click)="closePokemonSelector()">
    <div class="modal-content" (click)="$event.stopPropagation()">

      <div class="modal-top">
        <h3>Seleccionar Pokémon</h3>
        <button type="button" class="icon-close" (click)="closePokemonSelector()">✕</button>
      </div>

      <div class="pokemon-search">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Buscar Pokémon por nombre / id..."
          class="search-input"
          (input)="filterPokemons()"
        />
      </div>

      <p class="modal-info" *ngIf="loadingPokemons">Cargando Pokémon…</p>
      <p class="modal-error" *ngIf="!loadingPokemons && errorPokemons">{{ errorPokemons }}</p>

      <div class="pokemon-grid-selector" *ngIf="!loadingPokemons && !errorPokemons">
        <div
          *ngFor="let pokemon of filteredPokemons"
          class="pokemon-selector-card"
          (click)="selectPokemon(pokemon)"
        >
          <img
            [src]="pokemonCardSprite(pokemon)"
            [alt]="pokemon?.name?.english"
            class="pokemon-sprite"
            (error)="$any($event.target).style.display='none'"
          />
          <div class="pokemon-info">
            <span class="pokemon-name">{{ pokemon.name.english }}</span>
            <span class="pokemon-id">#{{ pokemon.id }}</span>
          </div>
          <div class="pokemon-types">
            <span
              *ngFor="let type of pokemon.type"
              class="type-badge"
              [class]="'type-' + (type | lowercase)"
            >
              {{ type }}
            </span>
          </div>
        </div>
      </div>

      <button type="button" class="btn btn-secondary" (click)="closePokemonSelector()">Cerrar</button>
    </div>
  </div>
</div>
